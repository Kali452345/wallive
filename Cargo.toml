[package]
name = "wallive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Extremely low-resource live video wallpaper for Windows"
publish = false

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
